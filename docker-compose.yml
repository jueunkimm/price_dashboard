services:
  db:
    image: postgres:16
    container_name: price_dashboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-price}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-price_pw}
      POSTGRES_DB: ${POSTGRES_DB:-price_dashboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-price} -d ${POSTGRES_DB:-price_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
