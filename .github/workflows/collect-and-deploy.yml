name: collect-and-deploy

# 매일 09:00 / 15:00 KST 자동 수집 → 정적 JSON 생성 → GitHub Pages 배포
on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC = 09:00 KST
    - cron: "0 6 * * *" # 06:00 UTC = 15:00 KST
  workflow_dispatch: {} # 수동 실행 버튼

permissions:
  contents: write # keepalive 하트비트 커밋 푸시용 (cron 자동 비활성화 방지)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # SQLite 파일 DB (backend/app.db). 모든 python은 backend 디렉터리에서 실행.
      DATABASE_URL: "sqlite+pysqlite:///./app.db"
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      # 가격 히스토리(변동률 계산용) 누적 — DB를 캐시로 보존. 2회/일 cron이라 항상 신선.
      - name: Restore price DB
        uses: actions/cache@v4
        with:
          path: backend/app.db
          key: pricedb-${{ github.run_id }}
          restore-keys: pricedb-

      # 캐시 미스 폴백 — 릴리스 백업에서 복원 (캐시는 7일 미사용 시 삭제됨: 9/8~10/28
      # 수집 공백 때 가격 이력을 통째로 잃은 원인. 릴리스 자산은 영구 보존)
      - name: Restore price DB from release backup (cache miss fallback)
        if: ${{ hashFiles('backend/app.db') == '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download db-backup -p app.db.gz -O /tmp/app.db.gz -R "$GITHUB_REPOSITORY" \
            && gunzip -c /tmp/app.db.gz > backend/app.db \
            && echo "릴리스 백업에서 DB 복원" || echo "릴리스 백업 없음 — 빈 DB로 시작"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      # 가격 수집 = 다나와 2-트랙 (네이버 쇼핑 검색 API는 2026-07-31 종료 — 재설계안_v2)
      #  Track A: 카테고리 인기순 시장 수집 / Track B: 쿠쿠 카탈로그 모델 전수
      #  두 수집기는 '0건=실패(exit 1)' 가드 내장 — 빈 결과로 기존 데이터를 덮지 않음
      - name: Seeds (idempotent) + 다나와 수집
        working-directory: backend
        run: |
          python -m app.seed
          python -m app.seed_brands
          python -m app.seed_events
          python -m app.seed_alerts
          python -m app.cuckoo_catalog
          python -m app.migrate
          python -m collector.collect_danawa_market --pages 3
          python -m collector.collect_danawa_own
          python -m collector.collect_demand --days 90
          python -m collector.collect_macro --days 120 || echo "ECOS 키 없으면 건너뜀"
          python -m collector.auto_seed_brands || true
          python -m collector.reclassify
          python -m collector.recategorize || true
          python -m collector.audit_categories || true
          python -m collector.evaluate_alerts
          python -m app.export_static

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend (정적)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Save price DB (다음 수집에 누적)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: backend/app.db
          key: pricedb-${{ github.run_id }}

      # 영구 백업 — 릴리스 자산(db-backup)에 업로드. 캐시 증발(7일) 대비 2중 보존.
      - name: Backup price DB to release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -c backend/app.db > /tmp/app.db.gz
          gh release view db-backup -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create db-backup --title "price DB backup" --notes "자동 백업(매 수집)" -R "$GITHUB_REPOSITORY"
          gh release upload db-backup /tmp/app.db.gz --clobber -R "$GITHUB_REPOSITORY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - uses: actions/deploy-pages@v4

      # GitHub는 저장소에 60일간 커밋 활동이 없으면 cron 워크플로를 자동 비활성화한다
      # (2026-09-08 수집 중단의 원인). 수집 때마다 하트비트 커밋을 남겨 활동으로 카운트
      # → 자동 비활성화 방지. [skip ci]로 deploy-on-push 중복 트리거는 차단.
      - name: Keepalive commit (cron 자동 비활성화 방지)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-collect.txt
          git add .github/last-collect.txt
          git commit -m "chore: collect heartbeat (keepalive) [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
